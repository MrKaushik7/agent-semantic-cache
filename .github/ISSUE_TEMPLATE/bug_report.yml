name: Bug report
description: Report reproducible behavior that does not work as documented
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first.
        Do not disclose vulnerabilities or secrets here; follow the [security policy](https://github.com/MrKaushik7/agent-semantic-cache/security/policy) instead.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what were you trying to do?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic sequence of commands or steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Give the release version or commit SHA where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Python, Go, dependency, and service versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or additional context
      description: Remove credentials, tokens, personal data, customer content, and unrelated secrets.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
        - label: I agree to follow the repository Code of Conduct.
          required: true
